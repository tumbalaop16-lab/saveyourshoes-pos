<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - SaveYourShoes POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- Navbar Kasir -->
    <nav class="bg-emerald-600 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">SaveYourShoes POS - Panel Kasir</h1>
        <button id="logout-btn" class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600 transition text-sm">Keluar (Logout)</button>
    </nav>

    <!-- Konten Utama -->
    <main class="flex-1 p-6 max-w-6xl w-full mx-auto">
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-2xl font-semibold text-slate-800 mb-2">Selamat Datang, Kasir!</h2>
            <p class="text-slate-600">Siap untuk mencatat transaksi dan layanan cuci sepatu pelanggan hari ini.</p>
            <p class="text-sm text-slate-400 mt-1" id="user-email"></p>
        </div>

        <!-- Area Transaksi / POS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Form Input Transaksi -->
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-md">
                <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Input Layanan Baru</h3>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Nama Pelanggan</label>
                        <input type="text" placeholder="Masukkan nama pelanggan" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Nomor WhatsApp</label>
                        <input type="tel" placeholder="08xxxxxxxxxx" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Jenis Layanan</label>
                        <select class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">-- Pilih Layanan --</option>
                            <option value="deep-clean">Deep Cleaning</option>
                            <option value="fast-clean">Fast Cleaning</option>
                            <option value="unyellowing">Unyellowing</option>
                            <option value="recolor">Recolor / Repaint</option>
                        </select>
                    </div>
                    <button type="button" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-medium hover:bg-emerald-700 transition">
                        + Tambah ke Antrean
                    </button>
                </form>
            </div>

            <!-- Ringkasan Kasir -->
            <div class="bg-white p-6 rounded-xl shadow-md flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Status Kasir</h3>
                    <div class="bg-emerald-50 text-emerald-800 p-4 rounded-lg text-sm mb-4">
                        <p class="font-semibold">Sistem Siap Digunakan</p>
                        <p class="text-xs text-emerald-600 mt-1">Gunakan form di samping untuk mulai mencatat orderan.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script Proteksi Role Kasir & Logout -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Ganti dengan konfigurasi Firebase Anda yang asli
        const firebaseConfig = {
            apiKey: "AIzaSyAMerqfzyxLNtW-U-kIP2s5ARaHsKOpEk8",
            authDomain: "saveyourshoes-pos.firebaseapp.com",
            projectId: "saveyourshoes-pos",
            storageBucket: "saveyourshoes-pos.firebasestorage",
            messagingSenderId: "414855345556",
            appId: "1:414855345556:web:f049e8b69ae9aef3068b81"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Proteksi Halaman: Pastikan user login & memiliki role 'cashier' (atau 'admin')
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && (userDoc.data().role === 'cashier' || userDoc.data().role === 'admin')) {
                    document.getElementById('user-email').textContent = "Kasir Aktif: " + user.email;
                } else {
                    alert("Akses ditolak! Anda tidak memiliki akses kasir.");
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // Fitur Tombol Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Gagal logout:", error);
            });
        });
    </script>
</body>
</html>
