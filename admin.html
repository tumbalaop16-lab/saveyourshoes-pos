<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SaveYourShoes POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">SaveYourShoes POS - Admin Dashboard</h1>
        <button id="logout-btn" class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600 transition text-sm">Keluar (Logout)</button>
    </nav>

    <!-- Konten Utama -->
    <main class="flex-1 p-6 max-w-6xl mx-w-full w-full mx-auto">
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-2xl font-semibold text-slate-800 mb-2">Selamat Datang, Admin!</h2>
            <p class="text-slate-600">Anda berhasil masuk ke panel administrator SaveYourShoes.</p>
            <p class="text-sm text-slate-400 mt-1" id="user-email"></p>
        </div>

        <!-- Grid Menu / Statistik Singkat -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500">
                <h3 class="text-slate-500 font-medium">Manajemen Pengguna</h3>
                <p class="text-2xl font-bold text-slate-800 mt-2">Atur Kasir</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500">
                <h3 class="text-slate-500 font-medium">Data Transaksi</h3>
                <p class="text-2xl font-bold text-slate-800 mt-2">Laporan Penjualan</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-purple-500">
                <h3 class="text-slate-500 font-medium">Inventaris Sepatu</h3>
                <p class="text-2xl font-bold text-slate-800 mt-2">Kelola Layanan</p>
            </div>
        </div>
    </main>

    <!-- Script Proteksi & Logout -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Ganti dengan konfigurasi Firebase Anda yang asli
        const firebaseConfig = {
            apiKey: "MASUKKAN_API_KEY_ANDA_DISINI",
            authDomain: "saveyourshoes-pos.firebaseapp.com",
            projectId: "saveyourshoes-pos",
            storageBucket: "saveyourshoes-pos.appspot.com",
            messagingSenderId: "MASUKKAN_MESSAGING_SENDER_ID_ANDA",
            appId: "MASUKKAN_APP_ID_ANDA"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Cek Keamanan: Pastikan user yang masuk benar-benar Admin
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === 'admin') {
                    document.getElementById('user-email').textContent = "Login sebagai: " + user.email;
                } else {
                    alert("Akses ditolak! Anda bukan admin.");
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // Tombol Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Gagal logout", error);
            });
        });
    </script>
</body>
</html>
