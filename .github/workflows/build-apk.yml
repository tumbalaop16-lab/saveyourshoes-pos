name: Build Web to APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      -- name: 5. Check Java and Node.js
  run: |
    java -version
    node --version
      - name: 6. Generate Android Project
        run: |
          bubblewrap init \
            --manifest=https://tumbalaop16-lab.github.io/saveyourshoes-pos/manifest.json

      - name: 7. Build Android APK
        run: bubblewrap build

      - name: 8. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaveYourShoes-APK
          path: |
            app-release-signed.apk
            app-release-unsigned.apk
            app-release-bundle.aab
          if-no-files-found: warn
