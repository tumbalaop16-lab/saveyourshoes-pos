name: Build Web to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 3. Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Build Full Release APK
      run: |
        npm install -g @bubblewrap/cli
        
        # Inisialisasi TWA dengan konfigurasi lengkap aplikasi kasir Anda
        bubblewrap init --manifest https://tumbalaop16-lab.github.io/saveyourshoes-pos/manifest.json --directory ./android --skip-manifest-validation --name "SaveYourShoes POS" --short_name "SaveShoes" --application-id "com.tumbalaop16.saveyourshoespos" --theme-color "#000000" --background-color "#ffffff" --start-url "/saveyourshoes-pos/"
        
        # Masuk ke folder android dan build APK rilis
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: 5. Upload Real APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaveYourShoes-APK-Final
        path: |
          android/app/build/outputs/apk/release/*.apk
