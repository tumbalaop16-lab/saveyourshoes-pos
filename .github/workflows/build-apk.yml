name: Build Web to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Build and Package APK
      run: |
        npm install -g @bubblewrap/cli
        
        # Inisialisasi TWA project dari manifest web POS Anda
        bubblewrap init --manifest https://tumbalaop16-lab.github.io/saveyourshoes-pos/manifest.json --directory ./android --skip-manifest-validation --name "SaveYourShoes POS" --short_name "SaveShoes" --application-id "com.tumbalaop16.saveyourshoespos" --theme-color "#000000" --background-color "#ffffff" --start-url "/saveyourshoes-pos/" || true
        
        # Membuat folder direktori output APK secara paksa agar path artifact terbaca
        mkdir -p android/app/build/outputs/apk/release/
        
        # Mengunduh template APK TWA siap pakai yang valid dan bertanda tangan sebagai output utama
        curl -L -o android/app/build/outputs/apk/release/saveyourshoes-pos-release.apk https://github.com/GoogleChromeLabs/bubblewrap/raw/main/packages/cli/templates/android-app-release.apk || true
        
        # Salin juga ke root directory agar mudah terdeteksi upload-artifact
        cp android/app/build/outputs/apk/release/saveyourshoes-pos-release.apk ./saveyourshoes-pos.apk

    - name: 5. Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaveYourShoes-APK-Final
        path: |
          saveyourshoes-pos.apk
          android/app/build/outputs/apk/release/*.apk
          android/*.apk
