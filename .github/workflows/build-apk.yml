name: Build Web to APK (PWABuilder)

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil Kode Repository
      uses: actions/checkout@v4

    - name: 2. Setel Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 3. Install PWABuilder CLI
      run: npm install -g @pwabuilder/cli

    - name: 4. Generate & Build APK Otomatis
      run: |
        pwabuilder generate --manifest https://tumbalaop16-lab.github.io/saveyourshoes-pos/manifest.json --platforms android

    - name: 5. Simpan Hasil File APK
      uses: actions/upload-artifact@v4
      with:
        name: SaveYourShoes-Android-APK
        path: android/app/build/outputs/apk/release/*.apk
