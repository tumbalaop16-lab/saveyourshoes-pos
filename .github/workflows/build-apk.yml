name: Build Web to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 3. Install PWABuilder CLI
      run: npm install -g @pwabuilder/pwapush

    - name: 4. Generate Android Package
      run: npx @pwabuilder/cli generate --manifest https://tumbalaop16-lab.github.io/saveyourshoes-pos/manifest.json --name "SaveYourShoes POS" --short_name "SaveShoes" --start_url "https://tumbalaop16-lab.github.io/saveyourshoes-pos/" --background_color "#ffffff" --theme_color "#000000" --icon "https://tumbalaop16-lab.github.io/saveyourshoes-pos/icon.png" --platforms android

    - name: 5. Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaveYourShoes-APK
        path: |
          *.apk
          android/app/build/outputs/apk/release/*.apk
