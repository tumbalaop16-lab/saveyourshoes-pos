name: Build Web to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 3. Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Install Bubblewrap CLI
      run: npm install -g @pwabuilder/bubblewrap

    - name: 5. Build TWA Project Locally
      run: |
        bubblewrap init --manifest ./manifest.json --directory ./android
        bubblewrap build --directory ./android

    - name: 6. Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaveYourShoes-APK
        path: |
          android/app/build/outputs/apk/release/*.apk
          android/*.apks
