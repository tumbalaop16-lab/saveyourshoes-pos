name: Build Web to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Generate Android TWA with Bubblewrap Action
      uses: app-builder/bubblewrap-action@main
      with:
        manifest-url: 'https://tumbalaop16-lab.github.io/saveyourshoes-pos/manifest.json'
        output-file: 'saveyourshoes.apk'

    - name: 4. Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaveYourShoes-APK
        path: |
          *.apk
          app/build/outputs/apk/release/*.apk
