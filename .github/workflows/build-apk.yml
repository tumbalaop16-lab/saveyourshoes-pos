name: Build Web to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Build APK with PWABuilder CLI
      uses: firfi/pwabuilder-action@master
      with:
        url: 'https://tumbalaop16-lab.github.io/saveyourshoes-pos/'

    - name: 3. Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaveYourShoes-APK
        path: |
          *.apk
          android/app/build/outputs/apk/release/*.apk
