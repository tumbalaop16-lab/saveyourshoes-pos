<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SaveYourShoes POS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-slate-200">
        
        <!-- Header & Logo Brand -->
        <div class="text-center mb-6">
            <div class="flex justify-center mb-3">
                <div class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-md border-4 border-white">
                    <span class="text-2xl font-black tracking-wider">SYS</span>
                </div>
            </div>
            <h1 class="text-xl font-extrabold text-slate-800 tracking-wide">SAVE YOUR SHOES</h1>
            <p class="text-xs font-medium text-slate-500 mt-0.5">Sistem Kasir & Operasional Service</p>
            
            <!-- Kontak & Sosmed -->
            <div class="mt-3 text-[11px] text-slate-500 space-y-0.5">
                <p>📞 WA: 082326172488</p>
                <p>IG: @saveyourshoes_official | TikTok: @saveyourshoesofficial</p>
            </div>
        </div>

        <!-- Form Login -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Username / Email</label>
                <input type="text" id="username" placeholder="Masukkan username atau email terdaftar" required class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition shadow-md text-sm flex items-center justify-center space-x-2">
                <span>🚪 Masuk</span>
            </button>
        </form>
        
        <!-- Pesan Error -->
        <p id="error-msg" class="text-red-500 text-xs mt-4 text-center font-medium hidden"></p>
    </div>

    <!-- Firebase SDK & Script Login -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMerqfzyxLNtW-U-kIP2s5ARaHsKOpEk8",
            authDomain: "saveyourshoes-pos.firebaseapp.com",
            projectId: "saveyourshoes-pos",
            storageBucket: "saveyourshoes-pos.firebasestorage",
            messagingSenderId: "414855345556",
            appId: "1:414855345556:web:f049e8b69ae9aef3068b81"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputVal = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            errorMsg.classList.add('hidden');

            const emailToUse = inputVal.includes('@') ? inputVal : `${inputVal.toLowerCase()}@saveyourshoes.com`;

            try {
                // 1. Authenticate Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, emailToUse, password);
                const user = userCredential.user;

                let userRole = null;

                // 2. Cek Dokumen Firestore via User UID
                const docByUid = await getDoc(doc(db, "users", user.uid));
                if (docByUid.exists() && docByUid.data().role) {
                    userRole = docByUid.data().role.toLowerCase();
                }

                // 3. Jika tidak ketemu via UID, coba Cek Dokumen Firestore via Email
                if (!userRole) {
                    const docByEmail = await getDoc(doc(db, "users", user.email.toLowerCase()));
                    if (docByEmail.exists() && docByEmail.data().role) {
                        userRole = docByEmail.data().role.toLowerCase();
                    }
                }

                // 4. Jika masih belum ketemu, cari dokumen yang punya field email == user.email
                if (!userRole) {
                    const q = query(collection(db, "users"), where("email", "==", user.email.toLowerCase()));
                    const querySnap = await getDocs(q);
                    if (!querySnap.empty) {
                        userRole = querySnap.docs[0].data().role.toLowerCase();
                    }
                }

                console.log("Role terdeteksi:", userRole);

                // 5. Routing Pengalihan Halaman
                if (userRole === 'owner') {
                    window.location.href = "owner.html";
                } else if (userRole === 'admin') {
                    window.location.href = "admin.html";
                } else if (userRole === 'cashier' || userRole === 'kasir') {
                    window.location.href = "cashier.html";
                } else {
                    // Default fallback jika role belum diset di Firestore
                    window.location.href = "admin.html";
                }

            } catch (error) {
                console.error("Login error:", error);
                errorMsg.textContent = "Gagal Masuk: Periksa kembali Username/Email dan Kata Sandi Anda.";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
